# Atualizações de dependências controladas (cada atualização passa pelo pipeline DevSecOps antes do merge)
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
