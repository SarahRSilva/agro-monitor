version: "3.9"

services:

  # ── 1. Gerador de Dados (Producer) ──────────────────────────────────────
  # Simula sensores IoT enviando leituras para o Kafka
  sensor-producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: agro_sensor_producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: sensor-readings
      INTERVALO_SEGUNDOS: "5"
    networks:
      - agro-net
    restart: unless-stopped

  # ── 2. Consumidor / Motor de Regras ─────────────────────────────────────
  # Consome leituras do Kafka, aplica regras booleanas e gera alertas
  rules-engine:
    build:
      context: ./rules-engine
      dockerfile: Dockerfile
    container_name: agro_rules_engine
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_IN: sensor-readings
      KAFKA_TOPIC_OUT: alerts
    networks:
      - agro-net
    restart: unless-stopped

  # ── 3. API Flask (Dashboard Backend) ────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: agro_api
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_READINGS: sensor-readings
      KAFKA_TOPIC_ALERTS: alerts
    volumes:
      - dados-vol:/app/dados
    networks:
      - agro-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 4. Apache Kafka ──────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: agro_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - agro-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── 5. Zookeeper (exigido pelo Kafka) ───────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: agro_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - agro-net

  # ── 6. Kafka UI (visualização dos tópicos) ───────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: agro_kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: agro-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - agro-net

networks:
  agro-net:
    driver: bridge

volumes:
  dados-vol:
    driver: local
